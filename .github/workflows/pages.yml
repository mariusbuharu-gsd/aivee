name: pages
# Publishes apps/site to GitHub Pages. Runs only on main: Pages needs a public repo, and
# develop/PR builds of the site are checked by the `site` job in ci.yml instead.
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - docs/brand/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: npm run build
        working-directory: apps/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
