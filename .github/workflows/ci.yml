name: ci
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit + integration)
        run: uv run pytest -m "integration or not integration" --cov --cov-report=term-missing
      - name: Contracts schema is up to date
        run: uv run python -m aivee_contracts.export && git diff --exit-code packages/contracts/schema

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - name: Contract types are up to date
        run: npm run contracts && git diff --exit-code src/contracts
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v
