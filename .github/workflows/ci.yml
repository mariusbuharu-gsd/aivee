name: ci
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit + integration)
        run: uv run pytest -m "integration or not integration" --cov --cov-report=term-missing
      - name: Contracts schema is up to date
        run: uv run python -m aivee_contracts.export && git diff --exit-code packages/contracts/schema

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
