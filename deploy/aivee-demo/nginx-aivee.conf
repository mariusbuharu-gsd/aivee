# PROPOSAL, not installed by the deploy. The manager's shared `*.earth.sv.gsd.com.ro` block
# proxies with HTTP/1.0 and drops the Upgrade header, so no WebSocket reaches Traefik: the
# dashboard's live feed (/ws/events) and MQTT over wss (mqtt-aivee) fail with it, and responses
# are buffered (MJPEG live view). Like gsd-os-hub.conf, these blocks are more specific than the
# wildcard and win for their names only; the shared block and every other site stay as they are.
#
# Install (Marius, on the manager):
#   sudo cp nginx-aivee.conf /etc/nginx/sites-available/aivee.conf
#   sudo ln -s ../sites-available/aivee.conf /etc/nginx/sites-enabled/aivee.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Remove: sudo rm /etc/nginx/sites-enabled/aivee.conf && sudo nginx -t && sudo systemctl reload nginx
#
# $connection_upgrade is already defined in /etc/nginx/conf.d/gsd-os-hub-limits.conf.

server {
    listen 443 ssl;
    server_name app-aivee.earth.sv.gsd.com.ro mqtt-aivee.earth.sv.gsd.com.ro;

    ssl_certificate     /etc/letsencrypt/live/earth.sv.gsd.com.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/earth.sv.gsd.com.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Staff photos and uploaded clips.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:8288;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live sockets (dashboard, edges) are idle between messages; MJPEG streams for long.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
