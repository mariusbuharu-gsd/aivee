# Server broker (stack aivee-demo). Same auth and ACL as infra/mosquitto/mosquitto.conf, plus a
# WebSockets listener that Traefik exposes as wss://mqtt-aivee.earth.sv.gsd.com.ro (TLS ends at
# the manager's nginx). 1883 stays inside the stack's overlay network: api, ingest, vision.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/

listener 1883

listener 9001
protocol websockets
