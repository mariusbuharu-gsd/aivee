[project]
name = "aivee-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["aivee-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivee_ingest"]

[tool.uv.sources]
aivee-contracts = { workspace = true }
