[project]
name = "aivee-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "aivee-contracts",
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Enrolment models (YOLO person crops + the edge's CLIP embedder). Heavy, so the API image and
# the ingest worker (which depends on this package for the DB layer) stay slim without them.
ml = ["aivee-edge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivee_api"]

[tool.uv.sources]
aivee-contracts = { workspace = true }
aivee-edge = { workspace = true }
