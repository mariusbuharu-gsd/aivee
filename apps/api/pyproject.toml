[project]
name = "aivee-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aivee-contracts",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivee_api"]

[tool.uv.sources]
aivee-contracts = { workspace = true }
