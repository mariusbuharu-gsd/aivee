# Dashboard container: static SPA + same-origin proxy to the API (service `api`, port 8000).
# Swarm DNS can move the api VIP on redeploys, so the upstream name is resolved per request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Staff photos (≤ 50 MB each), uploaded clips (≤ 200 MB) and connector frames.
    client_max_body_size 210m;

    # REST, plus streaming responses (MJPEG live view): no buffering, long reads. The upstream's
    # X-Accel-Buffering header is passed on so the manager's nginx does not buffer either.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # Live alerts, suggestions and detection boxes.
    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The service worker and the HTML shell must be re-checked, or a deploy is not seen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes (/intra, /alerte, /invitatie/<token>, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
