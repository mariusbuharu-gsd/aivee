services:
  mosquitto:
    image: eclipse-mosquitto:2
    env_file: .env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    ports: ["1883:1883"]

  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  # One-shot: apply Alembic migrations before ingest starts.
  migrate:
    build: { context: ., dockerfile: apps/ingest/Dockerfile }
    image: aivee-ingest:dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["python", "-m", "aivee_api.db.migrate", "upgrade"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Two replicas split events through the `$share/ingest/...` shared subscription.
  ingest:
    build: { context: ., dockerfile: apps/ingest/Dockerfile }
    image: aivee-ingest:dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SNAPSHOT_DIR: /data/snapshots
    volumes:
      - snapshots:/data/snapshots
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }
    deploy:
      replicas: 2
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports: ["8554:8554", "8889:8889", "8189:8189/udp"]

volumes:
  mosquitto-data: {}
  pg-data: {}
  snapshots: {}
