services:
  mosquitto:
    image: eclipse-mosquitto:2
    env_file: .env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    ports: ["1883:1883"]

  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  # One-shot: apply Alembic migrations before ingest starts.
  migrate:
    build: { context: ., dockerfile: apps/ingest/Dockerfile }
    image: aivee-ingest:dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["python", "-m", "aivee_api.db.migrate", "upgrade"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Two replicas split events through the `$share/ingest/...` shared subscription.
  ingest:
    build: { context: ., dockerfile: apps/ingest/Dockerfile }
    image: aivee-ingest:dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SNAPSHOT_DIR: /data/snapshots
    # Same dir as the host API's default SNAPSHOT_DIR (data/snapshots). Runs as the host
    # user so the files stay readable and the dir writable: `mkdir -p data/snapshots` first,
    # otherwise Docker creates it owned by root.
    user: "${AIVEE_UID:-1000}:${AIVEE_GID:-1000}"
    volumes:
      - ./data/snapshots:/data/snapshots
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }
    deploy:
      replicas: 2
    restart: unless-stopped

  # Relays camera streams (never records). Publishing needs STREAM_PUBLISH_USER/PASSWORD;
  # reading stays open for the dashboard live view and the cloud vision worker.
  mediamtx:
    image: bluenviron/mediamtx:1-ffmpeg
    env_file: .env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.base.yml:ro
      - ./infra/mediamtx/entrypoint.sh:/entrypoint.sh:ro
    ports: ["8554:8554", "8889:8889", "8189:8189/udp"]

  # Cloud mode (`docker compose --profile cloud up -d`): the edge pipeline running next to
  # MediaMTX, analysing the stream the restaurant's connector pushes. Frames stay in memory.
  # One service = one camera for now; a per-camera supervisor comes with multi-tenancy.
  vision:
    profiles: ["cloud"]
    build: { context: ., dockerfile: apps/edge/Dockerfile }
    image: aivee-edge:dev
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      CAMERA_ID: "${CAMERA_ID:-cam-01}"
      SOURCE: "rtsp://mediamtx:8554/${CAMERA_ID:-cam-01}"
      TARGET_FPS: "${CLOUD_FPS:-5}"
      ROTATE: "0" # the connector already sends the picture upright
    volumes:
      - ./models:/app/models:ro
    depends_on:
      mosquitto: { condition: service_started }
      mediamtx: { condition: service_started }
    restart: unless-stopped

  # HTTP API for the dashboard; publishes retained rules/config/profiles to the edge.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Slim by default (~0.5 GB): photo enrolment then answers 503 with a Romanian message.
      # API_UV_EXTRAS="--extra ml" adds the enrolment models (CPU torch; ~2.6 GB image).
      args: { UV_EXTRAS: "${API_UV_EXTRAS:-}" }
    image: aivee-api:dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SNAPSHOT_DIR: /data/snapshots
      YOLO_WEIGHTS: /app/models/yolo11n.pt
      HF_HOME: /home/aivee/.cache/huggingface
    volumes:
      - ./data/snapshots:/data/snapshots
      - ./models:/app/models:ro
      - hf-cache:/home/aivee/.cache/huggingface
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }
    restart: unless-stopped

volumes:
  mosquitto-data: {}
  pg-data: {}
  hf-cache: {}
