# AiVee on site: "Edge on the customer's PC" and "Edge box" (ADR 0011).
# The vision pipeline runs in the restaurant and sends only events and blurred snapshots to the
# AiVee cloud over MQTT. Video never leaves the restaurant.
#
# On the restaurant machine (Docker installed), in a folder holding this file, `edge.env` and
# a `models/` folder:
#   cp edge.env.example edge.env   # fill in the values from the AiVee dashboard
#   docker compose -f compose.yml up -d --remove-orphans
#
# One service = one device, however many cameras: list them in CAMERAS in edge.env (see
# docs/handbook/ip-cameras.md). One process keeps one MQTT connection; two services with the
# same device credential would knock each other off the broker. `--remove-orphans` removes
# the older per-camera `camera-1` service.
x-edge: &edge
  image: ${AIVEE_EDGE_IMAGE:-aivee-edge:dev}
  env_file: edge.env
  volumes:
    - ./models:/app/models:ro
  restart: unless-stopped
  logging:
    driver: local
    options: { max-size: "10m", max-file: "3" }

services:
  edge:
    <<: *edge
